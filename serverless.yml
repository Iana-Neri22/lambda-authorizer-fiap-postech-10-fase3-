service: FiapLanchoneteAuthorizer

provider:
  name: aws
  runtime: python3.11
  region: us-east-1

functions:
  authorizer:
    handler: lambda_function.lambda_handler
    events:
      - http:
          path: /authorize
          method: post
          cors: true
    layers:
      - { Ref: PythonRequirementsLambdaLayer }
  generateToken:
    handler: lambda_function.generate_token_handler
    events:
      - http:
          path: /token
          method: get
          cors: true
    layers:
      - { Ref: PythonRequirementsLambdaLayer }

plugins:
  - serverless-python-requirements

package:
  individually: true
  include:
    - src/**
    - lambda_function.py
    - .env
    - requirements.txt
    - .requirements/**
  exclude:
    - node_modules/**
    - venv/**
    - .git/**
    - .vscode/**

custom:
  pythonRequirements:
    noDeploy:
      - boto3
      - botocore
      - docutils
      - jmespath
      - python-dateutil
      - s3transfer
      - six
      - urllib3
    zip: true
    slim: true
    strip: true
    useStaticCache: true
    useDownloadCache: true
    cacheLocation: './.serverless/requirements'
    noCache: false
    dockerizePip: false
    layer: true
    layerName: lambda-authorizer-dependencies
    compatibleRuntimes:
      - python3.11
